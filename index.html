<!DOCTYPE html>
<html lang="ru">
<head>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #9c27b0;
      --primary-light: #bb86fc;
      --primary-dark: #6a0dad;
      --accent: #03dac6;
      --bg-dark: #121212;
      --bg-medium: #212121;
      --bg-light: #333333;
      --text-light: #ffffff;
      --text-medium: #e0e0e0;
      --text-muted: #9e9e9e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }
    /* Магический фон */
    .magic-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
    .stars { position: absolute; width: 100%; height: 100%; background: url('https://www.transparenttextures.com/patterns/stardust.png'); opacity: 0.5; }
    .magic-circle { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(156, 39, 176, 0.2) 0%, rgba(0, 0, 0, 0) 70%); animation: pulse 10s infinite alternate; }
    .circle1 { width: 800px; height: 800px; top: -300px; left: -300px; }
    .circle2 { width: 600px; height: 600px; bottom: -200px; right: -200px; animation-delay: 3s; }
    .circle3 { width: 400px; height: 400px; top: 50%; left: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(3, 218, 198, 0.1) 0%, rgba(0, 0, 0, 0) 70%); animation-delay: 1.5s; }
    .floating-symbols { position: absolute; width: 100%; height: 100%; pointer-events: none; }
    /* Основные стили контента */
    .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 2rem; flex: 1; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
    header { text-align: center; margin-bottom: 2rem; position: relative; }
    h1 {
      font-size: 3.5rem;
      font-weight: 700;
      margin: 1rem 0;
      background: linear-gradient(45deg, var(--primary-light), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(187, 134, 252, 0.3));
      font-family: 'Georgia', serif;
      position: relative;
      display: inline-block;
    }
    h1::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary-light), transparent);
    }
    p.subtitle { font-size: 1.2rem; color: var(--text-muted); font-style: italic; margin-bottom: 1rem; }
    /* Чат */
    .chat-container {
      background: rgba(33, 33, 33, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .chat-header {
      padding: 1rem 1.5rem;
      background: linear-gradient(90deg, var(--primary-dark), var(--primary));
      display: flex;
      align-items: center;
      border-radius: 20px 20px 0 0;
      color: var(--text-light);
    }
    .profile-pic {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--accent);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-right: 1rem;
      font-size: 1.2rem;
      color: var(--bg-dark);
    }
    .chat-info { flex: 1; }
    .chat-name { font-weight: 600; font-size: 1.1rem; }
    .status { font-size: 0.8rem; opacity: 0.8; }
    .status.online::before { content: "●"; color: #4CAF50; margin-right: 5px; }
    .chat-icons { display: flex; gap: 1rem; }
    .icon-button {
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.3s;
    }
    .icon-button:hover { opacity: 1; }
    .chat-window {
      height: 400px;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      scroll-behavior: smooth;
    }
    .chat-window::-webkit-scrollbar { width: 6px; }
    .chat-window::-webkit-scrollbar-track { background: var(--bg-medium); }
    .chat-window::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }
    .message {
      max-width: 80%;
      margin-bottom: 1rem;
      padding: 0.8rem 1.2rem;
      border-radius: 18px;
      position: relative;
      animation: fadeIn 0.3s ease forwards;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      word-break: break-word;
      transform-origin: left bottom;
    }
    .message-time {
      font-size: 0.7rem;
      opacity: 0.7;
      margin-top: 0.3rem;
      text-align: right;
    }
    .user-message {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--text-light);
      border-bottom-right-radius: 4px;
      animation: messageInRight 0.3s forwards;
    }
    .assistant-message {
      align-self: flex-start;
      background: var(--bg-light);
      color: var(--text-light);
      border-bottom-left-radius: 4px;
      animation: messageInLeft 0.3s forwards;
    }
    .user-message .message-time { color: rgba(255, 255, 255, 0.7); }
    .assistant-message .message-time { color: var(--text-muted); }
    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.5rem 1rem;
    }
    .typing-dot {
      width: 8px;
      height: 8px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: typingBounce 1.4s infinite;
      opacity: 0.7;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    .input-area {
      display: flex;
      align-items: center;
      padding: 1rem 1.5rem;
      background: var(--bg-medium);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    .question-box {
      flex: 1;
      background: var(--bg-light);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 0.8rem 1rem;
      color: var(--text-light);
      font-size: 1rem;
      resize: none;
      max-height: 120px;
      min-height: 48px;
      transition: all 0.3s;
      outline: none;
      font-family: inherit;
    }
    .question-box:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 2px rgba(187, 134, 252, 0.3);
    }
    .input-buttons {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: 0.5rem;
    }
    .send-button {
      background: var(--primary);
      color: var(--text-light);
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 2px 8px rgba(156, 39, 176, 0.4);
    }
    .send-button:hover {
      background: var(--primary-light);
      transform: scale(1.05);
    }
    .send-button:active { transform: scale(0.95); }
    .send-button i { font-size: 1.2rem; }
    /* Дополнительные функции */
    .features-container {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 2rem;
      flex-wrap: wrap;
      padding: 0 1rem;
    }
    .feature-card {
      background: rgba(33, 33, 33, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      width: 180px;
      transition: all 0.3s;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .feature-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      border-color: var(--primary);
    }
    .feature-icon { font-size: 2rem; color: var(--primary-light); margin-bottom: 1rem; }
    .feature-title { font-size: 1rem; margin-bottom: 0.5rem; color: var(--text-medium); }
    .counter { font-size: 0.8rem; color: var(--accent); }
    /* Анимации */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.5; }
      100% { opacity: 0.3; transform: scale(1.1); }
    }
    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% { transform: translateY(-1000%) rotate(360deg); opacity: 0; }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes messageInRight {
      0% { opacity: 0; transform: translateX(20px) scale(0.9); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes messageInLeft {
      0% { opacity: 0; transform: translateX(-20px) scale(0.9); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-4px); }
    }
    /* Адаптивность */
    @media (max-width: 768px) {
      .container { padding: 1rem; }
      h1 { font-size: 2.5rem; }
      .features-container { gap: 1rem; }
      .feature-card { width: 140px; padding: 1rem; }
      .chat-window { height: 350px; }
    }
    @media (max-width: 480px) {
      h1 { font-size: 2rem; }
      p.subtitle { font-size: 1rem; }
      .chat-header { padding: 0.8rem 1rem; }
      .chat-window { height: 300px; padding: 1rem; }
      .input-area { padding: 0.8rem 1rem; }
      .send-button { width: 42px; height: 42px; }
      .feature-card { width: calc(50% - 0.5rem); }
    }
  </style>
</head>

    // Функция для отправки вопроса
    function askQuestion() {
      const questionBox = document.getElementById('question-box');
      const chatWindow = document.getElementById('chat-window');
      const questionText = questionBox.value.trim();
      if (!questionText) return; // если поле пустое, ничего не делаем

      // Добавляем сообщение пользователя
      const userMessage = document.createElement('div');
      userMessage.classList.add('message', 'user-message');
      userMessage.innerHTML = questionText + '<div class="message-time">' + new Date().toLocaleTimeString() + '</div>';
      chatWindow.appendChild(userMessage);
      chatWindow.scrollTop = chatWindow.scrollHeight;

      // Очищаем поле ввода
      questionBox.value = '';

      // Симуляция набора ответа (typing indicator)
      const typingIndicator = document.createElement('div');
      typingIndicator.classList.add('message', 'assistant-message');
      typingIndicator.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
      chatWindow.appendChild(typingIndicator);
      chatWindow.scrollTop = chatWindow.scrollHeight;

      // Через секунду заменяем индикатор случайным ответом
      setTimeout(function() {
        chatWindow.removeChild(typingIndicator);
        const assistantMessage = document.createElement('div');
        assistantMessage.classList.add('message', 'assistant-message');
        const randomResponse = responses[Math.floor(Math.random() * responses.length)];
        assistantMessage.innerHTML = randomResponse + '<div class="message-time">' + new Date().toLocaleTimeString() + '</div>';
        chatWindow.appendChild(assistantMessage);
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }, 1000);
    }
  </script>
</body>
</html>
